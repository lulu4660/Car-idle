name: Tests

# À chaque envoi : règles du jeu (économie, progression, monde de la balade) avec Godot,
# sans affichage.

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer Godot (en cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Télécharger Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot && rm godot.zip
      - name: Importer le projet
        run: ./godot --headless --path . --editor --quit || true
      - name: Tests des règles
        run: ./godot --headless --path . -s tests/run_tests.gd
