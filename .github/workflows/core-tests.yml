name: Tests du cœur du jeu

# À chaque envoi : compile le cœur du jeu (Assets/Scripts/Core) en C# 9 comme Unity,
# et fait tourner ses tests (Assets/Tests/EditMode) sans avoir besoin de Unity.

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        run: dotnet test tools/CoreTests/CoreTests.csproj
